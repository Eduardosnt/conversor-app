<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Arquivos</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #38bdf8;
        --primary-dark: #0284c7;
        --success: #22c55e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #111827);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: min(900px, 100%);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 3vw, 2.8rem);
        text-align: center;
      }

      .panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
        margin-top: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 16px;
        padding: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }

      input[type="file"],
      select,
      input[type="number"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #374151;
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        margin-bottom: 12px;
      }

      button {
        width: 100%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .status {
        margin-top: 24px;
        min-height: 24px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .status.success {
        color: var(--success);
      }

      .status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Conversor de Arquivos</h1>

      <div class="panel">
        <div class="card">
          <h2>Imagem</h2>
          <form id="imageForm">
            <label for="imageFile">Selecione a imagem</label>
            <input id="imageFile" type="file" accept="image/*" />

            <label for="imageFormat">Formato</label>
            <select id="imageFormat">
              <option value="png">PNG</option>
              <option value="jpg">JPG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WEBP</option>
              <option value="avif">AVIF</option>
            </select>

            <label for="imageWidth">Largura (opcional)</label>
            <input id="imageWidth" type="number" min="1" placeholder="Ex: 800" />

            <label for="imageHeight">Altura (opcional)</label>
            <input id="imageHeight" type="number" min="1" placeholder="Ex: 600" />

            <button type="submit">Converter Imagem</button>
          </form>
        </div>

        <div class="card">
          <h2>Vídeo</h2>
          <form id="videoForm">
            <label for="videoFile">Selecione o vídeo</label>
            <input id="videoFile" type="file" accept="video/*" />

            <label for="videoFormat">Formato</label>
            <select id="videoFormat">
              <option value="mp4">MP4</option>
              <option value="webm">WEBM</option>
              <option value="avi">AVI</option>
            </select>

            <button type="submit">Converter Vídeo</button>
          </form>
        </div>
      </div>

      <div id="status" class="status"></div>
    </div>

    <script>
      const statusEl = document.getElementById('status');

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      document.getElementById('imageForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const fileInput = document.getElementById('imageFile');
        const file = fileInput.files[0];
        if (!file) {
          setStatus('Selecione uma imagem primeiro.', 'error');
          return;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('format', document.getElementById('imageFormat').value);

        const width = document.getElementById('imageWidth').value;
        const height = document.getElementById('imageHeight').value;

        if (width) formData.append('width', width);
        if (height) formData.append('height', height);

        setStatus('Convertendo imagem...');

        try {
          const response = await fetch('/convert-image', {
            method: 'POST',
            body: formData,
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || 'Erro ao converter imagem');
          }

          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'imagem-convertida';
          a.click();
          window.URL.revokeObjectURL(url);

          setStatus('Imagem convertida com sucesso!', 'success');
        } catch (error) {
          setStatus(error.message || 'Erro ao converter imagem.', 'error');
        }
      });

      document.getElementById('videoForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const fileInput = document.getElementById('videoFile');
        const file = fileInput.files[0];
        if (!file) {
          setStatus('Selecione um vídeo primeiro.', 'error');
          return;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('format', document.getElementById('videoFormat').value);

        setStatus('Convertendo vídeo...');

        try {
          const response = await fetch('/convert-video', {
            method: 'POST',
            body: formData,
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || 'Erro ao converter vídeo');
          }

          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'video-convertido';
          a.click();
          window.URL.revokeObjectURL(url);

          setStatus('Vídeo convertido com sucesso!', 'success');
        } catch (error) {
          setStatus(error.message || 'Erro ao converter vídeo.', 'error');
        }
      });
    </script>
  </body>
</html>
